<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<title>Story Stars</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e5484d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#fff8e7;--card:#fff;--ink:#2b2a4c;--muted:#6b6a8a;--line:#f0e3c0;--accent:#ff7a59;--good:#2eb67d;--bad:#e5484d;--star:#ffb800;--paper:#fffdf6;--c:#ff7a59}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b32;--card:#2a2849;--ink:#f4f1ff;--muted:#a9a6cc;--line:#3b3860}}
:root[data-theme="dark"]{--bg:#1d1b32;--card:#2a2849;--ink:#f4f1ff;--muted:#a9a6cc;--line:#3b3860}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Andika","Century Gothic","Trebuchet MS",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:1000px;margin:0 auto;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
button,.btn{font:inherit;color:inherit;cursor:pointer;border:2px solid var(--line);border-radius:18px;padding:12px 18px;background:var(--card);font-weight:700;font-size:1.1rem;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.big{background:var(--c);color:#fff;border-color:transparent;font-size:1.4rem;padding:16px 22px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
button.good{background:var(--good);color:#fff;border-color:transparent}
button.small,.btn.small{font-size:.95rem;padding:8px 12px;border-radius:12px}
button:disabled{opacity:.35;cursor:default}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;white-space:nowrap}
.muted{color:var(--muted)}.center{text-align:center}
h1{font-size:clamp(1.6rem,5vw,2.3rem);margin:4px 0}
h2{margin:6px 0}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
/* shelf */
.next{display:flex;align-items:center;gap:14px;margin:14px 0;padding:12px;border-radius:20px;background:var(--card);border:3px solid var(--c);box-shadow:0 5px 0 var(--c)}
.next .nc{width:120px;flex:none;border-radius:10px;overflow:hidden}.next .nc svg{display:block;width:100%;height:auto}
.next b{font-size:1.3rem;display:block}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:14px}
.set{position:relative;display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:22px;background:var(--sb,var(--c));color:#fff;min-height:150px;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .12s;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.set:active{transform:translateY(3px)}
.set .num{font-size:3rem;font-weight:700;line-height:1}
.set .lbl{font-weight:700;font-size:1.15rem}
.set .sub{font-size:.88rem;opacity:.95}
.mbar{height:10px;background:rgba(255,255,255,.35);border-radius:99px;overflow:hidden;margin-top:auto}.mbar i{display:block;height:100%;background:#fff}
.set.soon{opacity:.5;filter:saturate(.55)}
.set .trophy{position:absolute;top:10px;right:12px;font-size:1.8rem}
/* set view */
.settag{display:inline-block;background:var(--sb,var(--c));color:#fff;border-radius:999px;padding:4px 14px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:16px;margin-top:14px}
.bk{position:relative;background:var(--card);border-radius:16px;overflow:hidden;border:3px solid var(--c);box-shadow:0 5px 0 var(--c);display:flex;flex-direction:column;transition:transform .12s}
.bk:active{transform:translateY(3px)}
.bk .cov svg{display:block;width:100%;height:auto}
.bk .bt{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
.bk small{color:var(--muted);font-weight:700}
.bk b{font-size:1.1rem;line-height:1.2}
.stars{color:var(--star);letter-spacing:2px;font-size:1.15rem}.stars .off{color:var(--line)}
.ribbon{position:absolute;top:8px;right:8px;background:var(--good);color:#fff;border-radius:99px;width:34px;height:34px;display:grid;place-items:center;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.25);font-size:1.1rem}
.bk.soon{border-style:dashed;box-shadow:none;opacity:.55}
.cov.blank{aspect-ratio:16/10;display:grid;place-items:center;font-size:2.5rem;background:var(--line)}
/* reader */
.reader{display:flex;flex-direction:column;gap:10px;min-height:calc(100dvh - 32px)}
.rtop{display:flex;align-items:center;gap:8px}
.rtt{flex:1;font-weight:700;font-size:1.2rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{flex:1;display:flex;align-items:center;justify-content:center;gap:14px}
.book{position:relative;width:min(calc(100vw - 200px),calc((100dvh - 150px)*1.08),860px);aspect-ratio:1.08;container-type:inline-size;perspective:2600px;flex:none}
.book::before,.book::after{content:"";position:absolute;inset:0;border-radius:6px 18px 18px 6px;background:var(--paper);border:1px solid #e3d6b8}
.book::before{transform:translate(9px,9px);opacity:.7}
.book::after{transform:translate(4.5px,4.5px)}
.page{position:absolute;inset:0;z-index:1;background:var(--paper);color:#2b2a4c;border-radius:6px 18px 18px 6px;border-left:12px solid var(--c);box-shadow:0 10px 28px rgba(0,0,0,.18);overflow:hidden;display:flex;flex-direction:column;transform-origin:left center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pic svg{display:block;width:100%;height:auto}
.txt{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:0 .32em;padding:1cqw 6cqw 3cqw;font-size:var(--fs,7.5cqw);font-weight:700;line-height:1.3;text-align:center}
.w{cursor:pointer;border-radius:.2em;padding:0 .06em;transition:background .25s}
.w.hi{background:#ffe27a}
.pno{position:absolute;bottom:1.6cqw;right:3cqw;font-size:3cqw;color:#b3a78f;font-weight:700}
.say{position:absolute;bottom:1.6cqw;left:2.5cqw;font-size:3.6cqw;padding:.6cqw 1.6cqw;border-radius:99px;background:#fff;border:2px solid #eadfc4;color:#2b2a4c}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.4) 100%);opacity:0;z-index:9}
.turn-next{z-index:5;animation:tn .75s cubic-bezier(.45,.05,.55,.95) forwards}
.turn-prev{z-index:5;animation:tp .75s cubic-bezier(.45,.05,.55,.95) forwards}
@keyframes tn{0%{transform:rotateY(0)}100%{transform:rotateY(-112deg)}}
@keyframes tp{0%{transform:rotateY(-112deg)}100%{transform:rotateY(0)}}
.turn-next .shade{animation:shIn .75s forwards}.turn-prev .shade{animation:shOut .75s forwards}
.under .shade{background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(0,0,0,0) 60%);animation:shOut .75s forwards}
@keyframes shIn{to{opacity:1}}@keyframes shOut{from{opacity:1}to{opacity:0}}
.fade-in{z-index:5;animation:fi .3s forwards}@keyframes fi{from{opacity:0}to{opacity:1}}
/* cover + end pages */
.cvt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2cqw;padding:1cqw 5cqw 3cqw;text-align:center}
.cvt .cvset{background:var(--sb,var(--c));color:#fff;border-radius:99px;padding:.4cqw 2.4cqw;font-size:3.2cqw;font-weight:700}
.cvt h2{font-size:8cqw;margin:0;line-height:1.1}
.wl{display:flex;flex-wrap:wrap;gap:1cqw;justify-content:center;font-size:2.9cqw;color:#6b6a8a}
.wl .w{background:#f6efdc;border-radius:99px;padding:.2cqw 1.6cqw}
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.6cqw;padding:4cqw;text-align:center}
.end .te{font-size:12cqw;font-weight:700;color:var(--c)}
.end .bs{font-size:8cqw;letter-spacing:1cqw;color:var(--star)}.end .bs .off{color:#eadfc4}
.end button{font-size:4.2cqw;padding:2cqw 4cqw;border-radius:3cqw;color:#2b2a4c;background:#fff;border-color:#eadfc4}
.end button.big{color:#fff;background:var(--c);font-size:5.2cqw;border-color:transparent}
.end .row{width:100%;max-width:80cqw}
.end p{margin:0;font-size:3.6cqw;color:#6b6a8a}
.arrow{width:72px;height:72px;border-radius:50%;background:var(--sb,var(--c));color:#fff;border:0;font-size:2rem;padding:0;flex:none;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.arrow:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--c);transition:width .4s}
@media (max-width:700px){
  .stage{flex-wrap:wrap;align-content:center;justify-content:space-between;gap:16px 0}
  .book{order:-1;width:min(calc(100vw - 42px),calc((100dvh - 250px)*1.08))}
  .arrow{width:84px;height:64px;border-radius:22px}
}
@media (prefers-reduced-motion:reduce){.turn-next,.turn-prev{animation-duration:.01s}}
/* parent */
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow span{flex:1}
textarea,input{font:inherit;width:100%;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.cf{position:fixed;top:-40px;font-size:2rem;pointer-events:none;z-index:20;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;text-align:center}
</style>
</head>
<body>
<main id="app"></main>
<script src="art.js"></script>
<script src="books.js"></script>
<script src="sets/set2.js"></script>
<script src="sets/set3.js"></script>
<script src="sets/set4.js"></script>
<script src="sets/set5.js"></script>
<script src="sets/set6.js"></script>
<script src="sets/set7.js"></script>
<script src="sets/set8.js"></script>
<script src="sets/set9.js"></script>
<script src="sets/set10.js"></script>
<script>
var KEY = "storyStars.v1", S = null, app = document.getElementById("app");
var KID = "Emerson";

/* ---------- storage ---------- */
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!S || typeof S !== "object") S = {};
  S.read = S.read || {};
  if (S.tap === undefined) S.tap = true;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function today() { var d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
function reads(id) { return (S.read[id] && S.read[id].n) || 0; }
function esc(t) { var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
function setOf(n) { return SETS[n - 1]; }
function written(n) { var c = 0; for (var b = 1; b <= 10; b++) if (BOOKS[n + "-" + b]) c++; return c; }
function readIn(n) { var c = 0; for (var b = 1; b <= 10; b++) if (reads(n + "-" + b)) c++; return c; }
function totalRead() { var c = 0; for (var k in BOOKS) if (reads(k)) c++; return c; }
function totalStars() { var c = 0; for (var k in BOOKS) c += Math.min(3, reads(k)); return c; }
function starsHtml(r) { var h = ""; for (var i = 0; i < 3; i++) h += i < r ? "★" : '<span class="off">★</span>'; return h; }
function setStyle(st) { return "--c:" + st.c + (st.bg ? ";--sb:" + st.bg : ""); }
function coverScene(b) { var c = b.cover; if (typeof c === "number") return b.pages[c - 1][1]; return c || b.pages[0][1]; }
function nextUnread() {
  for (var s = 1; s <= SETS.length; s++) for (var b = 1; b <= 10; b++) { var id = s + "-" + b; if (BOOKS[id] && !reads(id)) return id; }
  return null;
}

/* ---------- sound ---------- */
function toast(m) { var d = document.createElement("div"); d.className = "toast"; d.textContent = m; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 3200); }
function speak(t, onb, onend) {
  if (S.mute) return;
  try {
    if (!window.speechSynthesis) { toast("Voice isn’t available here. Try Chrome or Safari."); return; }
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(t); u.rate = .78; u.lang = "en-US";
    if (onb) u.onboundary = onb;
    if (onend) u.onend = u.onerror = onend;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function hush() { try { speechSynthesis.cancel(); } catch (e) {} }
var AC = null;
function ac() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); return AC; } catch (e) { return null; } }
function tone(f, d, t) { if (S.mute) return; var a = ac(); if (!a) return; var o = a.createOscillator(), g = a.createGain(); o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(.15, a.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + t + d); o.connect(g); g.connect(a.destination); o.start(a.currentTime + t); o.stop(a.currentTime + t + d); }
function chime() { tone(660, .18, 0); tone(880, .18, .12); tone(1100, .3, .24); tone(1320, .4, .38); }
function swish() {
  if (S.mute) return; var a = ac(); if (!a) return;
  try {
    var len = Math.floor(a.sampleRate * .35), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / len);
    var src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = buf; f.type = "bandpass"; f.Q.value = .8;
    f.frequency.setValueAtTime(900, a.currentTime); f.frequency.exponentialRampToValueAtTime(3500, a.currentTime + .3);
    g.gain.value = .22; src.connect(f); f.connect(g); g.connect(a.destination); src.start();
  } catch (e) {}
}
function confetti() {
  var e = ["⭐", "🎉", "✨", "🎈", "🌟", "📚"];
  for (var i = 0; i < 32; i++) { var s = document.createElement("span"); s.className = "cf"; s.textContent = e[i % e.length]; s.style.left = Math.random() * 100 + "vw"; s.style.animationDelay = Math.random() * .6 + "s"; document.body.appendChild(s); (function (n) { setTimeout(function () { n.remove(); }, 3200); })(s); }
}

/* ---------- words ---------- */
function clean(w) { return w.toLowerCase().replace(/[^a-z']/g, ""); }
function wordsHtml(text) {
  return text.split(/\s+/).map(function (w, i) { return '<span class="w" data-i="' + i + '" data-w="' + esc(clean(w)) + '">' + esc(w) + '</span>'; }).join(" ");
}
function bookWords(b) {
  var seen = {}, out = [];
  b.pages.forEach(function (p) { p[0].split(/\s+/).forEach(function (w) { var raw = w.replace(/[^A-Za-z']/g, ""), k = raw.toLowerCase(); if (k && !seen[k]) { seen[k] = 1; out.push(raw === "I" || /^[A-Z][a-z]+$/.test(raw) && ["Emerson", "Olivia", "Lauren", "Mom", "Dad"].indexOf(raw) >= 0 ? raw : k); } }); });
  return out;
}
function fsFor(t) { var l = t.length; return l <= 14 ? "9.5cqw" : l <= 24 ? "8cqw" : l <= 36 ? "6.8cqw" : l <= 60 ? "5.6cqw" : l <= 85 ? "4.8cqw" : "4.3cqw"; }

/* ---------- router ---------- */
function route() {
  hush();
  var h = location.hash.replace(/^#\/?/, ""), m;
  document.onkeydown = null;
  if ((m = h.match(/^set\/(\d+)$/)) && setOf(+m[1])) return setView(+m[1]);
  if ((m = h.match(/^book\/(\d+-\d+)$/)) && BOOKS[m[1]]) return reader(m[1]);
  if (h === "parent") return gate();
  home();
}
window.addEventListener("hashchange", route);
function goHash(h) { if (location.hash === h) route(); else location.hash = h; }

/* ---------- shelf ---------- */
function home() {
  document.documentElement.style.removeProperty("--c");
  var nx = nextUnread(), h = '<div class="hdr"><h1>📚 ' + KID + '’s Bookshelf</h1><div class="row" style="flex:0 0 auto"><span class="pill">📖 ' + totalRead() + ' read</span><span class="pill">⭐ ' + totalStars() + '</span></div></div>';
  if (nx) {
    var nb = BOOKS[nx], ns = setOf(+nx.split("-")[0]);
    h += '<a class="next" href="#/book/' + nx + '" style="' + setStyle(ns) + '"><div class="nc">' + ART.scene(coverScene(nb)) + '</div><div><span class="muted">▶ Read next · Set ' + ns.n + ', Book ' + nx.split("-")[1] + '</span><b>' + esc(nb.t) + '</b></div></a>';
  } else if (totalRead()) h += '<p class="center" style="font-size:1.3rem">🏆 You read every book! Read them again for more stars.</p>';
  h += '<div class="sets">';
  SETS.forEach(function (st) {
    var w = written(st.n), r = readIn(st.n);
    h += '<a class="set' + (w ? '' : ' soon') + '" href="#/set/' + st.n + '" style="' + setStyle(st) + '">' + (w && r === 10 ? '<span class="trophy">🏆</span>' : '') +
      '<span class="num">' + st.n + '</span><span class="lbl">Set ' + st.n + ' · ' + st.name + '</span><span class="sub">' + (w ? r + ' of 10 read' : 'Coming soon') + '</span>' +
      '<div class="mbar"><i style="width:' + (r * 10) + '%"></i></div></a>';
  });
  h += '</div><div class="row" style="margin-top:22px"><button class="small" id="snd">' + (S.mute ? "🔇 Sound off" : "🔊 Sound on") + '</button><a class="btn small" href="#/parent">🔒 Grown-ups</a></div>';
  app.innerHTML = h;
  document.getElementById("snd").onclick = function () { S.mute = !S.mute; save(); home(); };
}

function setView(n) {
  var st = setOf(n), h = '<div class="hdr" style="' + setStyle(st) + '"><a class="btn small" href="#/">← Shelf</a><span class="settag">Set ' + n + ' · ' + st.name + '</span><span class="pill">' + readIn(n) + ' / 10 read</span></div>';
  h += '<p class="center muted" style="margin:10px 0 0">' + esc(st.focus) + '</p><div class="books" style="' + setStyle(st) + '">';
  for (var b = 1; b <= 10; b++) {
    var id = n + "-" + b, bk = BOOKS[id], r = reads(id);
    if (bk) h += '<a class="bk" href="#/book/' + id + '"><div class="cov">' + ART.scene(coverScene(bk)) + '</div>' + (r ? '<span class="ribbon">✓</span>' : '') + '<div class="bt"><small>Book ' + b + '</small><b>' + esc(bk.t) + '</b><span class="stars">' + starsHtml(Math.min(3, r)) + '</span></div></a>';
    else h += '<div class="bk soon"><div class="cov blank">📖</div><div class="bt"><small>Book ' + b + '</small><b>Coming soon</b></div></div>';
  }
  app.innerHTML = h + '</div>';
}

/* ---------- reader ---------- */
function reader(id) {
  var parts = id.split("-"), sn = +parts[0], bn = +parts[1], st = setOf(sn), b = BOOKS[id];
  var N = b.pages.length + 2, i = 0, busy = false;
  app.innerHTML = '<div class="reader" style="' + setStyle(st) + '"><div class="rtop"><a class="btn small" href="#/set/' + sn + '" aria-label="Close book">✕</a><div class="rtt">' + esc(b.t) + '</div><button class="small" id="snd" aria-label="Sound">' + (S.mute ? "🔇" : "🔊") + '</button></div>' +
    '<div class="stage"><button class="arrow" id="prev" aria-label="Previous page">◀</button><div class="book" id="book"></div><button class="arrow" id="next" aria-label="Next page">▶</button></div>' +
    '<div class="prog"><i id="pb"></i></div></div>';
  var book = document.getElementById("book"), prevB = document.getElementById("prev"), nextB = document.getElementById("next");

  function pageHtml(k) {
    if (k === 0) return '<div class="pic">' + ART.scene(coverScene(b)) + '</div><div class="cvt"><span class="cvset">Set ' + sn + ' · Book ' + bn + '</span><h2>' + wordsHtml(b.t) + '</h2><div class="wl">' + bookWords(b).map(function (w) { return '<span class="w" data-w="' + esc(clean(w)) + '">' + esc(w) + '</span>'; }).join("") + '</div></div>';
    if (k === N - 1) {
      var r = reads(id);
      return '<div class="end"><div class="te">The End</div><div class="bs" id="bs">' + starsHtml(Math.min(3, r)) + '</div>' +
        '<button class="big" id="iread">⭐ I read it!</button><p id="rmsg">' + (r ? 'Read ' + r + ' time' + (r > 1 ? 's' : '') + (r < 3 ? '. Read it again for another star!' : '. Super reader!') : 'Tap when you read the whole book!') + '</p>' +
        '<div class="row"><button id="again">↺ Again</button><button id="nbk">Next book ▶</button></div></div>';
    }
    var p = b.pages[k - 1];
    return '<div class="pic">' + ART.scene(p[1]) + '</div><div class="txt" style="--fs:' + fsFor(p[0]) + '">' + wordsHtml(p[0]) + '</div>' +
      '<span class="pno">' + k + '</span>';
  }
  function wire(el, k) {
    Array.prototype.forEach.call(el.querySelectorAll(".w"), function (s) {
      s.onclick = function (e) { e.stopPropagation(); if (!S.tap) return; s.classList.add("hi"); setTimeout(function () { s.classList.remove("hi"); }, 900); speak(s.getAttribute("data-w") === "i" ? "I" : s.textContent.replace(/[^A-Za-z' ]/g, "")); };
    });
    if (k === N - 1) {
      el.querySelector("#iread").onclick = function () {
        var btn = this, wasSetDone = readIn(sn) === written(sn);
        S.read[id] = { n: reads(id) + 1, last: today() }; save();
        chime(); confetti();
        var r = reads(id);
        el.querySelector("#bs").innerHTML = starsHtml(Math.min(3, r));
        el.querySelector("#rmsg").textContent = r === 1 ? "Great reading, " + KID + "! 🎉" : "Read " + r + " times! " + (r <= 3 ? "New star! ⭐" : "Super reader!");
        btn.disabled = true; btn.textContent = "🎉 Great job!";
        if (!wasSetDone && readIn(sn) === 10) setTimeout(function () { toast("🏆 You finished Set " + sn + "!"); confetti(); }, 900);
      };
      el.querySelector("#again").onclick = function () { jump(0); };
      el.querySelector("#nbk").onclick = function () {
        var nid = bn < 10 ? sn + "-" + (bn + 1) : (sn + 1) + "-1";
        if (BOOKS[nid]) goHash("#/book/" + nid); else goHash("#/set/" + (BOOKS[nid] ? sn + 1 : sn));
      };
    }
  }
  function makePage(k) { var d = document.createElement("div"); d.className = "page"; d.innerHTML = pageHtml(k) + '<div class="shade"></div>'; wire(d, k); return d; }
  function upd() {
    prevB.disabled = i === 0; nextB.disabled = i === N - 1;
    document.getElementById("pb").style.width = Math.round(i / (N - 1) * 100) + "%";
  }
  function turn(j) {
    if (busy || j < 0 || j >= N || j === i) return;
    hush(); busy = true;
    var old = book.querySelector(".page"), nu = makePage(j), fwd = j > i;
    if (fwd) { nu.classList.add("under"); book.insertBefore(nu, old); old.classList.add("turn-next"); }
    else { nu.classList.add("turn-prev"); book.appendChild(nu); }
    swish();
    setTimeout(function () { old.remove(); nu.classList.remove("turn-prev", "under"); busy = false; }, 760);
    i = j; upd();
  }
  function jump(j) { turn(j); }
  prevB.onclick = function () { turn(i - 1); };
  nextB.onclick = function () { turn(i + 1); };
  document.getElementById("snd").onclick = function () { S.mute = !S.mute; save(); this.textContent = S.mute ? "🔇" : "🔊"; if (S.mute) hush(); };
  document.onkeydown = function (e) { if (e.key === "ArrowRight") turn(i + 1); else if (e.key === "ArrowLeft") turn(i - 1); };
  var tx = null, ty = null;
  book.addEventListener("touchstart", function (e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  book.addEventListener("touchend", function (e) {
    if (tx === null) return; var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) turn(dx < 0 ? i + 1 : i - 1);
  });
  book.appendChild(makePage(0)); upd();
}

/* ---------- grown-ups ---------- */
function gate() {
  var a = 2 + Math.floor(Math.random() * 7), c = 2 + Math.floor(Math.random() * 7);
  app.innerHTML = '<h1 class="center">Grown-ups only</h1><p class="center" style="font-size:1.6rem">What is ' + a + ' + ' + c + '?</p><input id="ans" inputmode="numeric" placeholder="Answer"><div class="row" style="margin-top:10px"><a class="btn" href="#/">← Back</a><button class="good" id="ok">Enter</button></div>';
  var inp = document.getElementById("ans"); inp.focus();
  function check() { if (parseInt(inp.value, 10) === a + c) parent(); else { inp.value = ""; inp.placeholder = "Try again"; } }
  document.getElementById("ok").onclick = check;
  inp.onkeydown = function (e) { if (e.key === "Enter") check(); };
}
function armed(btn, label, fn) { var first = btn.textContent; btn.onclick = function () { if (btn.getAttribute("data-arm")) fn(); else { btn.setAttribute("data-arm", "1"); btn.textContent = label; setTimeout(function () { btn.removeAttribute("data-arm"); btn.textContent = first; }, 3000); } }; }
function parent() {
  var h = '<div class="hdr"><h1>Grown-ups</h1><a class="btn small" href="#/">← Shelf</a></div>';
  h += '<div class="card"><b>Settings</b><button id="tp">Tap a word to hear it: ' + (S.tap ? "ON" : "OFF") + '</button><button id="mu">Sounds: ' + (S.mute ? "OFF" : "ON") + '</button></div>';
  h += '<h2 class="center" style="margin-top:16px">Reading log</h2><p class="center muted">' + totalRead() + ' books read · ' + totalStars() + ' stars. Use + and – to fix a count.</p>';
  SETS.forEach(function (st) {
    if (!written(st.n)) return;
    h += '<div class="card" style="margin-top:10px;border-color:' + st.c + '"><b style="color:' + st.c + '">Set ' + st.n + ' · ' + st.name + ' (' + readIn(st.n) + '/10)</b>';
    for (var b = 1; b <= 10; b++) {
      var id = st.n + "-" + b, bk = BOOKS[id]; if (!bk) continue;
      var r = S.read[id];
      h += '<div class="prow"><span>' + b + '. ' + esc(bk.t) + ' <small class="muted">' + (r && r.n ? '· read ' + r.n + '× · last ' + r.last : '· not read yet') + '</small></span><button class="small" data-m="' + id + '">–</button><button class="small" data-p="' + id + '">+</button></div>';
    }
    h += '</div>';
  });
  h += '<div class="card" style="margin-top:16px"><b>Backup</b><p class="muted" style="margin:0">Copy this code to save progress (or move it to another device). Paste a code and tap Restore to load it.</p><textarea id="bc" rows="4"></textarea><div class="row"><button id="cp">Copy code</button><button class="good" id="rs">Restore</button></div><p class="center muted" id="bmsg"></p></div>';
  h += '<div class="row" style="margin-top:16px"><button class="small" id="rst">Reset all reading progress</button></div>';
  app.innerHTML = h;
  var ta = document.getElementById("bc"), msg = document.getElementById("bmsg");
  try { ta.value = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); } catch (e) {}
  document.getElementById("tp").onclick = function () { S.tap = !S.tap; save(); parent(); };
  document.getElementById("mu").onclick = function () { S.mute = !S.mute; save(); parent(); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-p]"), function (bt) { bt.onclick = function () { var id = bt.getAttribute("data-p"); S.read[id] = { n: reads(id) + 1, last: today() }; save(); parent(); }; });
  Array.prototype.forEach.call(document.querySelectorAll("[data-m]"), function (bt) { bt.onclick = function () { var id = bt.getAttribute("data-m"), n = reads(id) - 1; if (n <= 0) delete S.read[id]; else S.read[id].n = n; save(); parent(); }; });
  document.getElementById("cp").onclick = function () { ta.select(); try { document.execCommand("copy"); msg.textContent = "Copied!"; } catch (e) { msg.textContent = "Press and hold the text to copy it."; } };
  document.getElementById("rs").onclick = function () {
    try { var o = JSON.parse(decodeURIComponent(escape(atob(ta.value.trim())))); if (!o || !o.read) throw 0; S = o; save(); load(); msg.textContent = "Restored!"; setTimeout(parent, 600); }
    catch (e) { msg.textContent = "That code didn’t work. Paste the whole code and try again."; }
  };
  armed(document.getElementById("rst"), "Tap again to erase all progress", function () { S.read = {}; save(); parent(); });
}

if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
load(); route();
</script>
